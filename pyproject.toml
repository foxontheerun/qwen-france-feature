[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "france-feature"
version = "0.1.0"
description = "A single SAE feature encoding the concept of France in Qwen3.5-2B-Base"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch",
    "transformers",
    "accelerate",
    "safetensors",
    "huggingface_hub",
    "numpy",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]
